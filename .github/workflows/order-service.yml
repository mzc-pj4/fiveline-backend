name: order-service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    paths:
      - "order-service/**"
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: fiveline/order-service

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: echo "Tests temporarily disabled"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: true
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost/test
          JWT_SECRET: test-secret-key
        run: |
          cd order-service
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
          pytest tests/ -v --cov=app --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mzc-pj4
            -Dsonar.projectKey=mzc-pj4_fiveline-backend
            -Dsonar.sources=order-service/app
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=order-service/coverage.xml

  aiops-review:
    name: AIOps Code Review
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'pull_request'

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: SonarCloud 결과 Bedrock으로 해석 후 PR 코멘트 등록
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          pip install boto3 requests -q
          python3 << 'EOF'
          import boto3, json, requests, os

          sonar_token = os.environ['SONAR_TOKEN']
          project_key = 'mzc-pj4_fiveline-backend'

          resp = requests.get(
              'https://sonarcloud.io/api/issues/search',
              params={
                  'componentKeys': project_key,
                  'resolved': 'false',
                  'ps': 20,
                  'types': 'BUG,VULNERABILITY,CODE_SMELL',
                  'directories': 'order-service'
              },
              auth=(sonar_token, '')
          )
          issues = resp.json().get('issues', [])

          if not issues:
              issue_text = "SonarCloud에서 발견된 이슈가 없습니다. 코드 품질이 양호합니다."
          else:
              lines = []
              for i in issues[:10]:
                  component = i.get('component', '').split(':')[-1]
                  lines.append(f"- [{i.get('type')}] {i.get('message')} (심각도: {i.get('severity')}, 파일: {component})")
              issue_text = '\n'.join(lines)

          bedrock = boto3.client('bedrock-runtime', region_name='ap-northeast-2')

          prompt = f"""당신은 시니어 백엔드 개발자입니다. 아래 SonarCloud 코드 분석 결과를 보고 PR 코드 리뷰 코멘트를 작성해주세요.

          SonarCloud 이슈 목록:
          {issue_text}

          다음 형식으로 한국어로 간결하게 작성해주세요:
          1. 전체 요약 (1-2문장)
          2. 주요 이슈별 설명 및 개선 방안 (있는 경우)
          3. 우선순위 권고사항"""

          body = json.dumps({
              'anthropic_version': 'bedrock-2023-05-31',
              'max_tokens': 1024,
              'messages': [{'role': 'user', 'content': prompt}]
          })

          response = bedrock.invoke_model(
              modelId='anthropic.claude-3-haiku-20240307-v1:0',
              body=body
          )
          review = json.loads(response['body'].read())['content'][0]['text']

          gh_token = os.environ['GITHUB_TOKEN']
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['REPO']

          comment_body = f"""## 🤖 AIOps 코드 리뷰 (Amazon Bedrock)

          ### SonarCloud 분석 결과 (order-service)
          {issue_text}

          ### AI 리뷰 (Claude)
          {review}

          ---
          *이 리뷰는 SonarCloud + Amazon Bedrock (Claude 3 Haiku)에 의해 자동 생성되었습니다.*"""

          r = requests.post(
              f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments',
              headers={
                  'Authorization': f'Bearer {gh_token}',
                  'Accept': 'application/vnd.github.v3+json'
              },
              json={'body': comment_body}
          )
          print(f"PR 코멘트 등록: {r.status_code}")
          EOF

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r order-service/requirements.txt

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: dependency-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: dev-${{ github.run_number }}-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./order-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-risk-summary:
    name: Deployment Risk Summary (Bedrock)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      risk_level: ${{ steps.analyze.outputs.risk_level }}
      risk_reason: ${{ steps.analyze.outputs.risk_reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 변경사항 + SonarCloud 이슈 기반 배포 위험도 분석 (Bedrock)
        id: analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          pip install boto3 requests -q
          python3 << 'EOF'
          import boto3, json, requests, os, subprocess

          sonar_token = os.environ['SONAR_TOKEN']
          project_key = 'mzc-pj4_fiveline-backend'

          resp = requests.get(
              'https://sonarcloud.io/api/issues/search',
              params={
                  'componentKeys': project_key,
                  'resolved': 'false',
                  'ps': 20,
                  'types': 'BUG,VULNERABILITY,CODE_SMELL',
                  'directories': 'order-service'
              },
              auth=(sonar_token, '')
          )
          issues = resp.json().get('issues', [])

          if not issues:
              issue_text = "SonarCloud에서 발견된 미해결 이슈가 없습니다."
          else:
              lines = []
              for i in issues[:10]:
                  component = i.get('component', '').split(':')[-1]
                  lines.append(f"- [{i.get('type')}] {i.get('message')} (심각도: {i.get('severity')}, 파일: {component})")
              issue_text = '\n'.join(lines)

          diff_stat = "(변경 파일 정보 없음)"
          for base in [os.environ.get('BEFORE_SHA', ''), 'HEAD~1']:
              if not base or base.startswith('0000000'):
                  continue
              result = subprocess.run(
                  ['git', 'diff', '--stat', base, 'HEAD', '--', 'order-service'],
                  capture_output=True, text=True
              )
              if result.returncode == 0 and result.stdout.strip():
                  diff_stat = result.stdout
                  break

          commit_message = os.environ.get('COMMIT_MESSAGE', '(커밋 메시지 없음)')

          bedrock = boto3.client('bedrock-runtime', region_name='ap-northeast-2')

          prompt = f"""당신은 시니어 SRE입니다. 아래 정보를 바탕으로 이번 배포의 위험도를 평가해주세요.

          커밋 메시지:
          {commit_message}

          변경된 파일:
          {diff_stat}

          SonarCloud 미해결 이슈 (order-service):
          {issue_text}

          다음 형식으로 한국어로 간결하게 답해주세요:
          위험도: (낮음/중간/높음) 중 하나
          이유: 1~2문장"""

          body = json.dumps({
              'anthropic_version': 'bedrock-2023-05-31',
              'max_tokens': 512,
              'messages': [{'role': 'user', 'content': prompt}]
          })

          response = bedrock.invoke_model(
              modelId='anthropic.claude-3-haiku-20240307-v1:0',
              body=body
          )
          analysis = json.loads(response['body'].read())['content'][0]['text']

          risk_level = '알수없음'
          risk_reason = ''
          for line in analysis.splitlines():
              line = line.strip()
              if line.startswith('위험도:'):
                  risk_level = line.split(':', 1)[1].strip()
              elif line.startswith('이유:'):
                  risk_reason = line.split(':', 1)[1].strip()

          github_output = os.environ.get('GITHUB_OUTPUT', '')
          if github_output:
              with open(github_output, 'a') as f:
                  f.write(f'risk_level={risk_level}\n')
                  f.write(f'risk_reason={risk_reason}\n')

          # 알림 비활성화 (복구하려면 아래 주석 해제)
          # requests.post(os.environ['SLACK_WEBHOOK_URL'], json={
          #     'text': f"🤖 *order-service 배포 위험도 분석 (Bedrock)*\n{analysis}"
          # })
          print(analysis)
          EOF

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    continue-on-error: true
    outputs:
      critical: ${{ steps.trivy-parse.outputs.critical }}
      high: ${{ steps.trivy-parse.outputs.high }}
      medium: ${{ steps.trivy-parse.outputs.medium }}
      low: ${{ steps.trivy-parse.outputs.low }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:dev-${{ github.run_number }}-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Run Trivy (JSON for metrics)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:dev-${{ github.run_number }}-${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          ignore-unfixed: true

      - name: Parse Trivy results
        if: always()
        id: trivy-parse
        run: |
          python3 << 'EOF'
          import json, os
          try:
              with open('trivy-results.json') as f:
                  data = json.load(f)
              counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}
              for r in data.get('Results', []):
                  for v in r.get('Vulnerabilities', []) or []:
                      sev = v.get('Severity', '')
                      if sev in counts:
                          counts[sev] += 1
          except Exception as e:
              print(f'trivy parse error: {e}')
              counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"critical={counts['CRITICAL']}\n")
              f.write(f"high={counts['HIGH']}\n")
              f.write(f"medium={counts['MEDIUM']}\n")
              f.write(f"low={counts['LOW']}\n")
          print(counts)
          EOF

  update-manifest:
    name: Update Manifest Repo
    runs-on: ubuntu-latest
    needs: trivy-scan
    environment: production
    steps:
      - name: Update image tag and create PR
        env:
          IMAGE_TAG: dev-${{ github.run_number }}-${{ github.sha }}
          GH_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/mzc-pj4/fiveline_k8s_manifest.git
          cd fiveline_k8s_manifest
          BRANCH=deploy/order-service-${{ github.run_number }}
          git checkout -b $BRANCH
          sed -i "s|fiveline/order-service:.*|fiveline/order-service:${IMAGE_TAG}|" k8s/apps/base/order-service/rollout.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/apps/base/order-service/rollout.yaml
          git commit -m "chore: update order-service image tag to ${IMAGE_TAG}"
          git push origin $BRANCH
          PR_URL=$(gh pr create \
            --repo mzc-pj4/fiveline_k8s_manifest \
            --title "chore: update order-service image tag to ${IMAGE_TAG}" \
            --body "$(printf '자동 생성된 PR입니다.\n\n서비스: order-service\n이미지 태그: %s\n실행자: ${{ github.actor }}' "${IMAGE_TAG}")" \
            --base main \
            --head $BRANCH)
          gh pr merge --squash \
            --repo mzc-pj4/fiveline_k8s_manifest \
            $BRANCH

  post-canary-analysis:
    name: Post-Canary AIOps Analysis (Bedrock)
    runs-on: ubuntu-latest
    needs: [update-manifest, deploy-risk-summary, trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for canary to stabilize
        run: sleep 300

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Analyze canary metrics with Bedrock
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE_TAG: dev-${{ github.run_number }}-${{ github.sha }}
          AIOPS_TABLE: fiveline-dev-aiops-canary-logs
          RISK_LEVEL: ${{ needs.deploy-risk-summary.outputs.risk_level }}
          RISK_REASON: ${{ needs.deploy-risk-summary.outputs.risk_reason }}
          TRIVY_CRITICAL: ${{ needs.trivy-scan.outputs.critical }}
          TRIVY_HIGH: ${{ needs.trivy-scan.outputs.high }}
          TRIVY_MEDIUM: ${{ needs.trivy-scan.outputs.medium }}
          TRIVY_LOW: ${{ needs.trivy-scan.outputs.low }}
        run: |
          pip install boto3 requests -q
          python3 << 'EOF'
          import boto3, json, requests, os
          from datetime import datetime, timedelta

          cw = boto3.client('cloudwatch', region_name='ap-northeast-2')
          elbv2 = boto3.client('elbv2', region_name='ap-northeast-2')

          albs = elbv2.describe_load_balancers(Names=['fiveline-alb'])
          alb_arn = albs['LoadBalancers'][0]['LoadBalancerArn']
          alb_suffix = '/'.join(alb_arn.split('/')[-3:])

          now = datetime.utcnow()
          start = now - timedelta(minutes=5)
          dims = [{'Name': 'LoadBalancer', 'Value': alb_suffix}]

          def get_metric(metric_name, stat):
              r = cw.get_metric_statistics(
                  Namespace='AWS/ApplicationELB',
                  MetricName=metric_name,
                  Dimensions=dims,
                  StartTime=start,
                  EndTime=now,
                  Period=300,
                  Statistics=[stat]
              )
              return r['Datapoints'][0][stat] if r['Datapoints'] else 0

          def get_percentile(metric_name, pct):
              r = cw.get_metric_statistics(
                  Namespace='AWS/ApplicationELB',
                  MetricName=metric_name,
                  Dimensions=dims,
                  StartTime=start,
                  EndTime=now,
                  Period=300,
                  ExtendedStatistics=[pct]
              )
              return r['Datapoints'][0]['ExtendedStatistics'][pct] if r['Datapoints'] else 0

          error_5xx_count = get_metric('HTTPCode_Target_5XX_Count', 'Sum')
          error_4xx_count = get_metric('HTTPCode_Target_4XX_Count', 'Sum')
          total_requests = get_metric('RequestCount', 'Sum')
          p99_latency = get_percentile('TargetResponseTime', 'p99') * 1000

          error_5xx_rate = (error_5xx_count / total_requests * 100) if total_requests > 0 else 0
          error_4xx_rate = (error_4xx_count / total_requests * 100) if total_requests > 0 else 0

          risk_level = os.environ.get('RISK_LEVEL', '알수없음')
          risk_reason = os.environ.get('RISK_REASON', '')
          trivy_critical = int(os.environ.get('TRIVY_CRITICAL', '0') or '0')
          trivy_high = int(os.environ.get('TRIVY_HIGH', '0') or '0')
          trivy_medium = int(os.environ.get('TRIVY_MEDIUM', '0') or '0')
          trivy_low = int(os.environ.get('TRIVY_LOW', '0') or '0')

          bedrock = boto3.client('bedrock-runtime', region_name='ap-northeast-2')
          prompt = f"""카나리 배포(order-service) 후 5분간 ALB 메트릭:
          - 이미지 태그: {os.environ['IMAGE_TAG']}
          - 총 요청 수: {total_requests:.0f}건
          - 5xx 에러 수: {error_5xx_count:.0f}건 (에러율: {error_5xx_rate:.2f}%)
          - 4xx 에러 수: {error_4xx_count:.0f}건 (에러율: {error_4xx_rate:.2f}%)
          - P99 응답시간: {p99_latency:.0f}ms
          - 배포 위험도: {risk_level}
          - 이미지 취약점: CRITICAL {trivy_critical}, HIGH {trivy_high}, MEDIUM {trivy_medium}

          카나리 트래픽 5%를 계속 확대할지 롤백할지 판단해줘.
          형식:
          상태: (정상/경고/위험)
          판단: 계속진행 또는 롤백권고
          이유: 1문장"""

          body = json.dumps({
              'anthropic_version': 'bedrock-2023-05-31',
              'max_tokens': 256,
              'messages': [{'role': 'user', 'content': prompt}]
          })
          response = bedrock.invoke_model(
              modelId='anthropic.claude-3-haiku-20240307-v1:0',
              body=body
          )
          analysis = json.loads(response['body'].read())['content'][0]['text']

          lines = {l.split(':')[0].strip(): ':'.join(l.split(':')[1:]).strip() for l in analysis.splitlines() if ':' in l}
          ai_status = lines.get('상태', '알수없음')
          ai_recommendation = lines.get('판단', '알수없음')
          ai_reason = lines.get('이유', analysis)

          image_tag = os.environ['IMAGE_TAG']
          deployed_at = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          ttl = int((now + timedelta(days=30)).timestamp())

          dynamodb = boto3.client('dynamodb', region_name='ap-northeast-2')
          dynamodb.put_item(
              TableName=os.environ['AIOPS_TABLE'],
              Item={
                  'service_name': {'S': 'order-service'},
                  'deployed_at': {'S': deployed_at},
                  'image_tag': {'S': image_tag},
                  'total_requests': {'N': str(int(total_requests))},
                  'error_count': {'N': str(int(error_5xx_count))},
                  'error_rate': {'N': f'{error_5xx_rate:.2f}'},
                  'error_4xx_count': {'N': str(int(error_4xx_count))},
                  'error_4xx_rate': {'N': f'{error_4xx_rate:.2f}'},
                  'p99_latency_ms': {'N': str(int(p99_latency))},
                  'risk_level': {'S': risk_level},
                  'risk_reason': {'S': risk_reason},
                  'trivy_critical': {'N': str(trivy_critical)},
                  'trivy_high': {'N': str(trivy_high)},
                  'trivy_medium': {'N': str(trivy_medium)},
                  'trivy_low': {'N': str(trivy_low)},
                  'ai_status': {'S': ai_status},
                  'ai_recommendation': {'S': ai_recommendation},
                  'ai_reason': {'S': ai_reason},
                  'ttl': {'N': str(ttl)},
              }
          )
          print(f'DynamoDB 저장 완료: {deployed_at}')

          # 알림 비활성화 (복구하려면 아래 주석 해제)
          # emoji = '🟢' if '정상' in analysis else ('🔴' if '위험' in analysis else '🟡')
          # requests.post(os.environ['SLACK_WEBHOOK_URL'], json={
          #     'text': f"{emoji} *order-service 카나리 AIOps 분석*\n{analysis}"
          # })
          print(analysis)
          EOF

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: update-manifest
    if: false

    steps:
      - name: Slack 알림
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ needs.update-manifest.result == 'success' && '✅' || '❌' }} *order-service 배포 ${{ needs.update-manifest.result == 'success' && '성공' || '실패' }}*\n브랜치: ${{ github.head_ref || github.ref_name }}\n실행자: ${{ github.actor }}\n커밋: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 이메일 알림
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ needs.update-manifest.result == 'success' && '✅' || '❌' }} order-service 배포 ${{ needs.update-manifest.result == 'success' && '성공' || '실패' }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            브랜치: ${{ github.ref_name }}
            실행자: ${{ github.actor }}
            커밋: ${{ github.sha }}
            결과: ${{ needs.update-manifest.result }}
