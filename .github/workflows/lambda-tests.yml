name: Lambda pytest

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "lambda/**"
  push:
    branches: [main, develop]
    paths:
      - "lambda/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Lambda pytest (54 tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: lambda/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r lambda/requirements-dev.txt

      - name: Run pytest
        id: pytest
        run: |
          cd lambda && pytest --tb=short \
            --junitxml=pytest-results.xml \
            -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: lambda/pytest-results.xml

      - name: Post result to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.pytest.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const msg = outcome === 'success'
              ? '## ${{ github.workflow }}\n✅ **Lambda pytest 전체 통과**\n\n모든 테스트가 정상 통과했습니다.'
              : '## ${{ github.workflow }}\n❌ **Lambda pytest 실패**\n\nActions 로그에서 실패 테스트를 확인해주세요.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg,
            });
