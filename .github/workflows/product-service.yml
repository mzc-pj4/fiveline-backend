name: product-service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "product-service/**"
  pull_request:
    paths:
      - "product-service/**"

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: fiveline/product-service

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: echo "Tests temporarily disabled"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost/test
          JWT_SECRET: test-secret-key
        run: |
          cd product-service
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
          pytest tests/ -v --cov=app --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mzc-pj4
            -Dsonar.projectKey=mzc-pj4_fiveline-backend
            -Dsonar.sources=product-service/app
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=product-service/coverage.xml

  aiops-review:
    name: AIOps Code Review
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.event_name == 'pull_request'

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: SonarCloud 결과 Bedrock으로 해석 후 PR 코멘트 등록
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          pip install boto3 requests -q
          python3 << 'EOF'
          import boto3, json, requests, os

          sonar_token = os.environ['SONAR_TOKEN']
          project_key = 'mzc-pj4_fiveline-backend'

          resp = requests.get(
              'https://sonarcloud.io/api/issues/search',
              params={
                  'componentKeys': project_key,
                  'resolved': 'false',
                  'ps': 20,
                  'types': 'BUG,VULNERABILITY,CODE_SMELL',
                  'directories': 'product-service'
              },
              auth=(sonar_token, '')
          )
          issues = resp.json().get('issues', [])

          if not issues:
              issue_text = "SonarCloud에서 발견된 이슈가 없습니다. 코드 품질이 양호합니다."
          else:
              lines = []
              for i in issues[:10]:
                  component = i.get('component', '').split(':')[-1]
                  lines.append(f"- [{i.get('type')}] {i.get('message')} (심각도: {i.get('severity')}, 파일: {component})")
              issue_text = '\n'.join(lines)

          bedrock = boto3.client('bedrock-runtime', region_name='ap-northeast-2')

          prompt = f"""당신은 시니어 백엔드 개발자입니다. 아래 SonarCloud 코드 분석 결과를 보고 PR 코드 리뷰 코멘트를 작성해주세요.

          SonarCloud 이슈 목록:
          {issue_text}

          다음 형식으로 한국어로 간결하게 작성해주세요:
          1. 전체 요약 (1-2문장)
          2. 주요 이슈별 설명 및 개선 방안 (있는 경우)
          3. 우선순위 권고사항"""

          body = json.dumps({
              'anthropic_version': 'bedrock-2023-05-31',
              'max_tokens': 1024,
              'messages': [{'role': 'user', 'content': prompt}]
          })

          response = bedrock.invoke_model(
              modelId='anthropic.claude-3-haiku-20240307-v1:0',
              body=body
          )
          review = json.loads(response['body'].read())['content'][0]['text']

          gh_token = os.environ['GITHUB_TOKEN']
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['REPO']

          comment_body = f"""## 🤖 AIOps 코드 리뷰 (Amazon Bedrock)

          ### SonarCloud 분석 결과 (product-service)
          {issue_text}

          ### AI 리뷰 (Claude)
          {review}

          ---
          *이 리뷰는 SonarCloud + Amazon Bedrock (Claude 3 Haiku)에 의해 자동 생성되었습니다.*"""

          r = requests.post(
              f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments',
              headers={
                  'Authorization': f'Bearer {gh_token}',
                  'Accept': 'application/vnd.github.v3+json'
              },
              json={'body': comment_body}
          )
          print(f"PR 코멘트 등록: {r.status_code}")
          EOF

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r product-service/requirements.txt

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: dependency-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: dev-${{ github.run_number }}-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./product-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:dev-${{ github.run_number }}-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  update-manifest:
    name: Update Manifest Repo
    runs-on: ubuntu-latest
    needs: trivy-scan
    environment: production

    steps:
      - name: Update image tag and create PR
        env:
          IMAGE_TAG: dev-${{ github.run_number }}-${{ github.sha }}
          GH_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${{ secrets.MANIFEST_REPO_TOKEN }}@github.com/mzc-pj4/fiveline_k8s_manifest.git
          cd fiveline_k8s_manifest
          BRANCH=deploy/product-service-${{ github.run_number }}
          git checkout -b $BRANCH
          sed -i "s|fiveline/product-service:.*|fiveline/product-service:${IMAGE_TAG}|" k8s/apps/base/product-service/deployment.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/apps/base/product-service/deployment.yaml
          git commit -m "chore: update product-service image tag to ${IMAGE_TAG}"
          git push origin $BRANCH
          gh pr create \
            --repo mzc-pj4/fiveline_k8s_manifest \
            --title "chore: update product-service image tag to ${IMAGE_TAG}" \
            --body "자동 생성된 PR입니다.\n\n서비스: product-service\n이미지 태그: ${IMAGE_TAG}\n실행자: ${{ github.actor }}" \
            --base main \
            --head $BRANCH

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: update-manifest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Slack 알림
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ needs.update-manifest.result == 'success' && '✅' || '❌' }} *product-service 배포 ${{ needs.update-manifest.result == 'success' && '성공' || '실패' }}*\n브랜치: ${{ github.head_ref || github.ref_name }}\n실행자: ${{ github.actor }}\n커밋: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 이메일 알림
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ needs.update-manifest.result == 'success' && '✅' || '❌' }} product-service 배포 ${{ needs.update-manifest.result == 'success' && '성공' || '실패' }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            브랜치: ${{ github.ref_name }}
            실행자: ${{ github.actor }}
            커밋: ${{ github.sha }}
            결과: ${{ needs.update-manifest.result }}
