[project]
name = "admin-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.0",
  "pyjwt>=2.9",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
