[pytest]
# fiveline-backend Lambda pytest 설정
# 실행: pytest lambda/ai/ai-remediation/tests/
# 전체: pytest lambda/

testpaths =
    ai
    data-pipeline
    observability

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 깔끔한 출력
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --import-mode=importlib

# 마커 정의 (느린 테스트 분리 등)
markers =
    slow: 느린 테스트 (외부 API 호출 등)
    integration: 통합 테스트 (실제 AWS 호출)
